name: Deploy server

on:
  push:
    branches: [claude/lapel-pin-app-architecture-nicohd]
    paths: [server/**, domain/**, gradle/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  id-token: write   # sign in to AWS with the OIDC role from infra/bootstrap.yaml
  contents: read

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check AWS setup
        id: check
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          PW: ${{ secrets.LAPEL_PASSWORD }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$PW" ]; then
            echo "AWS is not set up yet (see docs/setup-aws.md) – skipping deploy." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.ready == 'true'

      - name: Test and package server
        if: steps.check.outputs.ready == 'true'
        run: ./gradlew -p server test lambdaZip --console=plain

      - name: Diagnose AWS sign-in (no secrets printed)
        if: steps.check.outputs.ready == 'true'
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ "$ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/lapel-github-deploy$ ]]; then
            echo "AWS_DEPLOY_ROLE_ARN looks right (role lapel-github-deploy)."
          else
            echo "::warning::AWS_DEPLOY_ROLE_ARN does not look like arn:aws:iam::<12 digits>:role/lapel-github-deploy"
            echo "It starts with: ${ROLE:0:20}... and is ${#ROLE} characters long"
          fi
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "GitHub identity sent to AWS:"
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss, aud, sub}' || true

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check.outputs.ready == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: aws-actions/setup-sam@v2
        if: steps.check.outputs.ready == 'true'
        with:
          use-installer: true

      - name: Artifact bucket
        if: steps.check.outputs.ready == 'true'
        run: |
          BUCKET="lapel-artifacts-$(aws sts get-caller-identity --query Account --output text)"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || \
            aws s3api create-bucket --bucket "$BUCKET" --create-bucket-configuration LocationConstraint=eu-central-1
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        env:
          PW: ${{ secrets.LAPEL_PASSWORD }}
        run: |
          # Only a PBKDF2 hash of the password goes to AWS (same algorithm as server PasswordHash).
          HASH=$(python3 -c "import hashlib,os,sys
          pw=os.environ['PW']
          if len(pw) < 10: sys.exit('LAPEL_PASSWORD is shorter than 10 characters - choose a longer one in GitHub secrets')
          print(hashlib.pbkdf2_hmac('sha256', pw.encode(), b'lapel-login-v1', 200000).hex())")
          [ -n "$HASH" ] || exit 1
          sam deploy \
            --template-file server/template.yaml \
            --stack-name lapel-server \
            --s3-bucket "$BUCKET" --s3-prefix server \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides "PasswordHash=$HASH"

      - name: Server address
        if: steps.check.outputs.ready == 'true'
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name lapel-server \
            --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          echo "Server: $URL"
          echo "### Server address: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "${URL}api/health"
