[versions]
agp = "8.13.0"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
androidx-hilt = "1.2.0"
core-ktx = "1.16.0"
activity-compose = "1.10.1"
lifecycle = "2.9.1"
navigation = "2.9.0"
